[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
no_implicit_reexport = true
check_untyped_defs = true
exclude = ["venv/"]

[tool.pytest.ini_options]
addopts = "-q --no-header"

# EvaBot fail2ban filter
# Place at: /etc/fail2ban/filter.d/evabot.conf
#
# Catches suspicious requests to EvaBot Online server

[Definition]
failregex = \[HTTP\] \[REQUEST\] (?:GET|POST|PUT|DELETE|HEAD) (/wp-|/wordpress|/blog/wp-|/xmlrpc\.php|/admin/|/phpmyadmin|\.env|\.git|/backup|/etc/passwd|/cgi-bin)[^"]*"\s*\{[^}]*"ip":"<HOST>"

ignoreregex =
